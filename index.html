<html>
    <head>
    <link rel="stylesheet" href="styles.css">
    <script src="calculator.js" defer></script>
    </head>

    <body>
        <main class="calculator">
            <section class="display">
                <p class="display-history">&nbsp;</p>
                <output class="display-value">0</output>
            </section>

            <section class="keypad">
                <div class="key-row">
                    <button class="key" type="button">7</button>
                    <button class="key" type="button">8</button>
                    <button class="key" type="button">9</button>
                    <button class="key key-operator" type="button">/</button>
                </div>
                <div class="key-row">
                    <button class="key" type="button">4</button>
                    <button class="key" type="button">5</button>
                    <button class="key" type="button">6</button>
                    <button class="key key-operator" type="button">x</button>
                </div>
                <div class="key-row">
                    <button class="key" type="button">1</button>
                    <button class="key" type="button">2</button>
                    <button class="key" type="button">3</button>
                    <button class="key key-operator" type="button">-</button>
                </div>
                <div class="key-row">
                    <button class="key" type="button">0</button>
                    <button class="key key-function" type="button">Clear</button>
                    <button class="key key-operator" type="button">+</button>
                    <button class="key key-equals" type="button">=</button>
                </div>
            </section>
        </main>
    </body>
</html>
